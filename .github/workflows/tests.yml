name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  audit:
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
      - name: Install checkout as the tap
        run: |
          dest="$(brew --repository)/Library/Taps/ponchopig/homebrew-yams"
          mkdir -p "$(dirname "$dest")"
          cp -R "$GITHUB_WORKSPACE" "$dest"
      - name: Style
        run: brew style ponchopig/yams
      - name: Audit
        run: brew audit --strict --tap ponchopig/yams
